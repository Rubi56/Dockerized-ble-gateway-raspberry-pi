services:
  ble-vrel-gateway:
    build: .
    container_name: ble-vrel-gateway
    network_mode: host
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /run/dbus:/run/dbus
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - GATEWAY_NAME=VREL_BLE_Gateway
    restart: unless-stopped
